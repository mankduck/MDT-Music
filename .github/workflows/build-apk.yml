name: Build MDT Music Signed APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MDT_YOUTUBE_API_KEY: ${{ secrets.MDT_YOUTUBE_API_KEY }}
      MDT_KEYSTORE_PASSWORD: ${{ secrets.MDT_KEYSTORE_PASSWORD }}
      MDT_KEY_ALIAS: ${{ secrets.MDT_KEY_ALIAS }}
      MDT_KEY_PASSWORD: ${{ secrets.MDT_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.MDT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify permanent signing secrets
        run: |
          for name in KEYSTORE_BASE64 MDT_KEYSTORE_PASSWORD MDT_KEY_ALIAS MDT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; see SIGNING_INSTRUCTIONS.md"
              exit 1
            fi
          done
      - name: Restore permanent signing key
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdt-release.jks"
          echo "MDT_KEYSTORE_PATH=$RUNNER_TEMP/mdt-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK only
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MDT-Music-RELEASE-update
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
