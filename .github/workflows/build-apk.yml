name: Build MDT Music APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.MDT_KEYSTORE_BASE64 != '' }}
      MDT_YOUTUBE_API_KEY: ${{ secrets.MDT_YOUTUBE_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (testing only; signing may change)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MDT-Music-debug-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Restore permanent signing key
        if: ${{ env.HAS_KEY == 'true' }}
        run: echo 'Signing key is ready'
      - name: Build signed release APK
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MDT_KEYSTORE_BASE64 }}
          MDT_KEYSTORE_PASSWORD: ${{ secrets.MDT_KEYSTORE_PASSWORD }}
          MDT_KEY_ALIAS: ${{ secrets.MDT_KEY_ALIAS }}
          MDT_KEY_PASSWORD: ${{ secrets.MDT_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdt-release.jks"
          export MDT_KEYSTORE_PATH="$RUNNER_TEMP/mdt-release.jks"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.HAS_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MDT-Music-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
