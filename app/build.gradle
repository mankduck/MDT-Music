plugins { id 'com.android.application' }
android { namespace 'com.mdt.offlinemusic'; compileSdk 35
 defaultConfig { applicationId 'com.mdt.offlinemusic'; minSdk 26; targetSdk 35; versionCode 24; versionName '2.5.1' }
 def youtubeKey = (System.getenv("MDT_YOUTUBE_API_KEY") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
 defaultConfig { buildConfigField "String", "YOUTUBE_API_KEY", "\"${youtubeKey}\"" }
 buildFeatures { buildConfig true }
 signingConfigs { release {
   def kfile = System.getenv("MDT_KEYSTORE_PATH")
   if (kfile) { storeFile file(kfile); storePassword System.getenv("MDT_KEYSTORE_PASSWORD"); keyAlias System.getenv("MDT_KEY_ALIAS"); keyPassword System.getenv("MDT_KEY_PASSWORD") }
  } }
 buildTypes { release { minifyEnabled false; if (System.getenv("MDT_KEYSTORE_PATH")) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Android yt-dlp + FFmpeg bundled binaries (increases APK size)
dependencies {
 implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
 implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
