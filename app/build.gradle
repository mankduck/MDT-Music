plugins { id 'com.android.application' }
android { namespace 'com.mdt.offlinemusic'; compileSdk 35
 defaultConfig { applicationId 'com.mdt.offlinemusic'; minSdk 26; targetSdk 35; versionCode 7; versionName '1.6.0' }
 signingConfigs { release {
   def kfile = System.getenv("MDT_KEYSTORE_PATH")
   if (kfile) { storeFile file(kfile); storePassword System.getenv("MDT_KEYSTORE_PASSWORD"); keyAlias System.getenv("MDT_KEY_ALIAS"); keyPassword System.getenv("MDT_KEY_PASSWORD") }
  } }
 buildTypes { release { minifyEnabled false; if (System.getenv("MDT_KEYSTORE_PATH")) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
